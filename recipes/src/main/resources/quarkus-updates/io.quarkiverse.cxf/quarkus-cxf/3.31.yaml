#####
# Rules coming from https://docs.quarkiverse.io/quarkus-cxf/dev/release-notes/3.31.1.html
#
# The old proxy options are migrated already at their 3.31 deprecation (not at the announced
# 4.0.0 removal): the rewrite is a 1:1 equivalent of the recommended replacement and runs while
# both mechanisms still coexist (verifiable, reversible) - at 4.0.0 the old keys disappear and
# unmigrated clients would silently lose their proxy. It also fixes the 3.31+
# NoSuchElementException for proxy-server without proxy-server-port and silences the
# per-startup deprecation warnings.
#####
type: specs.openrewrite.org/v1beta/recipe
name: io.quarkus.updates.cxf.cxf331.UpdateAll
displayName: Migrate quarkus-cxf to 3.31
description: >-
  Migrates the deprecated per-client proxy options (proxy-server, proxy-server-port,
  proxy-username, proxy-password, non-proxy-hosts, proxy-server-type; removal announced for
  quarkus-cxf 4.0.0) to a named Quarkus Proxy Registry configuration referenced via
  quarkus.cxf.client."client-name".proxy-configuration-name, for quarkus-cxf 3.31.0.
recipeList:
  - io.quarkus.updates.quarkiverse.cxf.cxf331.MigrateClientProxyConfiguration
