#####
# Rules coming from https://docs.quarkiverse.io/quarkus-cxf/dev/release-notes/3.8.0.html
#####
type: specs.openrewrite.org/v1beta/recipe
name: io.quarkus.updates.cxf.cxf38.UpdateAll
displayName: Migrate quarkus-cxf to 3.8
description: >-
  Removes the retired logging extension (its functionality moved to io.quarkiverse.cxf:quarkus-cxf
  in 2.6.0, configuration properties unchanged) and relocates the Santuario XMLSec extension
  for quarkus-cxf 3.8.0.
recipeList:
  - org.openrewrite.java.dependencies.RemoveDependency:
      groupId: io.quarkiverse.cxf
      artifactId: quarkus-cxf-rt-features-logging
  # newVersion is only written when the project does not manage quarkus-cxf-santuario-xmlsec itself:
  # with an imported quarkus-cxf (platform) BOM the managed version wins and the version tag is
  # dropped from the dependency (overrideManagedVersion defaults to false)
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: io.quarkiverse.xmlsec
      oldArtifactId: quarkus-xmlsec
      newGroupId: io.quarkiverse.cxf
      newArtifactId: quarkus-cxf-santuario-xmlsec
      newVersion: 3.x
