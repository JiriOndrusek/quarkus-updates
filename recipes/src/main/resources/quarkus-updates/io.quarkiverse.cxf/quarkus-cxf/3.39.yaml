#####
# Rules coming from https://docs.quarkiverse.io/quarkus-cxf/dev/release-notes/3.39.0.html
#####
type: specs.openrewrite.org/v1beta/recipe
name: io.quarkus.updates.cxf.cxf339.UpdateAll
displayName: Migrate quarkus-cxf to 3.39
description: >-
  quarkus-cxf 3.39.0 no longer pulls io.quarkus:quarkus-jackson transitively. Adds an explicit
  quarkus-jackson dependency to applications that use Jackson classes in their sources and do not
  get the dependency from elsewhere.
recipeList:
  - io.quarkus.updates.cxf.cxf339.AddQuarkusJacksonIfUsed
---
type: specs.openrewrite.org/v1beta/recipe
name: io.quarkus.updates.cxf.cxf339.AddQuarkusJacksonIfUsed
displayName: Add quarkus-jackson if Jackson is used
description: >-
  Adds io.quarkus:quarkus-jackson to applications depending on io.quarkiverse.cxf:quarkus-cxf
  that use Jackson types in their sources, because quarkus-cxf stopped pulling quarkus-jackson
  transitively in 3.39.0. The dependency is not added when it is already available transitively
  through another extension, or when the application explicitly excludes io.quarkus:quarkus-jackson
  from a quarkus-cxf dependency.
preconditions:
  - io.quarkus.updates.quarkiverse.cxf.cxf339.FindQuarkusCxfWithoutJacksonExclusion
recipeList:
  - org.openrewrite.maven.AddDependency:
      groupId: io.quarkus
      artifactId: quarkus-jackson
      version: latest.release
      onlyIfUsing: com.fasterxml.jackson..*
      acceptTransitive: true
